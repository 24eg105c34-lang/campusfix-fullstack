services:
  - type: web
    name: campusfix-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: campusfix-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/complaints
    envVars:
      - key: DB_URL
        value: "jdbc:h2:mem:campusfix;DB_CLOSE_DELAY=-1"
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://*.vercel.app
